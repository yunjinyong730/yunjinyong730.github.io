name: temporary responsive UI smoke

on:
  push:
    branches:
      - fix/navigation-typography-mobile

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          sleep 1
      - name: Run responsive and history smoke test
        run: |
          cat > ./ui-smoke-temp.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const sizes = [
            { width: 375, height: 812, name: 'mobile-375' },
            { width: 430, height: 932, name: 'mobile-430' },
            { width: 768, height: 1024, name: 'tablet-768' },
            { width: 1440, height: 1000, name: 'desktop-1440' },
          ];

          for (const size of sizes) {
            const page = await browser.newPage({ viewport: size });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('.rs-entry .rs-primary', { timeout: 5000 });

            const landing = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - window.innerWidth,
              secondaryBriefButtons: [...document.querySelectorAll('.rs-entry > button:not(.rs-primary)')]
                .filter((node) => getComputedStyle(node).display !== 'none').length,
              primaryAfter: getComputedStyle(document.querySelector('.rs-entry .rs-primary'), '::after').content,
            }));

            if (landing.overflow > 1) throw new Error(`${size.name}: landing horizontal overflow ${landing.overflow}px`);
            if (landing.secondaryBriefButtons !== 0) throw new Error(`${size.name}: secondary brief controls still visible`);
            if (!['none', 'normal'].includes(landing.primaryAfter)) throw new Error(`${size.name}: primary button ::after still renders ${landing.primaryAfter}`);

            await page.fill('#landingInput', '윤진용의 대표 프로젝트를 보여줘');
            await page.press('#landingInput', 'Enter');
            await page.waitForSelector('#app.is-chatting', { timeout: 3000 });
            await page.waitForTimeout(350);

            const chat = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - window.innerWidth,
              sidebar: getComputedStyle(document.querySelector('.chat-sidebar')).display,
              conversationWidth: document.querySelector('.conversation').getBoundingClientRect().width,
              viewport: window.innerWidth,
            }));

            if (chat.overflow > 1) throw new Error(`${size.name}: chat horizontal overflow ${chat.overflow}px`);
            if (size.width <= 900 && chat.sidebar !== 'none') throw new Error(`${size.name}: mobile sidebar is ${chat.sidebar}`);
            if (chat.conversationWidth > chat.viewport + 1) throw new Error(`${size.name}: conversation exceeds viewport`);

            await page.goBack({ waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#app.is-landing', { timeout: 3000 });
            await page.goForward({ waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#app.is-chatting', { timeout: 3000 });

            console.log('PASS', size.name, landing, chat);
            await page.close();
          }

          await browser.close();
          EOF
          node ./ui-smoke-temp.mjs
