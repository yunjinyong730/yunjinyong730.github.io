name: temporary publications routing smoke

on:
  push:
    branches:
      - fix/publications-command-routing

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          sleep 1
      - name: Verify command routing and typed RAG
        run: |
          cat > ./publications-routing-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });

          await page.click('.menu-grid [data-command="research"]');
          await page.waitForSelector('#app.is-chatting');
          await page.waitForTimeout(350);

          await page.click('.sidebar-nav [data-command="publications"]');
          await page.waitForTimeout(450);

          let latest = page.locator('.answer-document').last();
          const commandText = await latest.innerText();
          if (/GROUNDED RAG|LOCAL GROUNDED FALLBACK/.test(commandText)) {
            throw new Error('Publications command was overwritten by RAG');
          }
          if (!/PUBLICATIONS|Sensor Calibration/i.test(commandText)) {
            throw new Error('Publications command did not render publication list');
          }

          await page.fill('#chatInput', '윤진용이 쓴 논문 중 가장 중요한 논문 알려줘');
          await page.press('#chatInput', 'Enter');
          await page.waitForTimeout(700);

          latest = page.locator('.answer-document').last();
          const typedText = await latest.innerText();
          if (!/GROUNDED RAG|검색된 포트폴리오 근거/.test(typedText)) {
            throw new Error('Typed reasoning question did not use RAG');
          }

          console.log('PASS explicit Publications route + typed RAG separation');
          await browser.close();
          EOF
          node ./publications-routing-smoke.mjs
