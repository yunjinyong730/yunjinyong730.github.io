name: live RAG smoke test

on:
  push:
    branches:
      - test/live-rag-smoke

permissions:
  contents: read

jobs:
  live-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test production RAG endpoint
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://yunjinyong730-github-io.vercel.app/api/rag"

          request() {
            local name="$1"
            local payload="$2"
            echo "=== $name ==="
            status=$(curl --silent --show-error --max-time 45 \
              -o response.json -w "%{http_code}" \
              -X POST "$ENDPOINT" \
              -H "Content-Type: application/json" \
              --data "$payload")
            echo "HTTP $status"
            cat response.json
            echo
          }

          request "Validation: missing query" '{"language":"ko","contextIds":["paper-jok-2026-scale"]}'
          test "$status" = "400"
          python3 - <<'PY'
          import json
          with open('response.json', encoding='utf-8') as f: data=json.load(f)
          assert data.get('error') == 'missing_query', data
          print('PASS validation: missing_query')
          PY

          request "Validation: missing contexts" '{"query":"테스트","language":"ko","contextIds":[]}'
          test "$status" = "400"
          python3 - <<'PY'
          import json
          with open('response.json', encoding='utf-8') as f: data=json.load(f)
          assert data.get('error') == 'missing_contexts', data
          print('PASS validation: missing_contexts')
          PY

          request "LLM generation: Korean judgment question" '{"query":"윤진용이 쓴 논문 중에 제일 중요한 논문 알려줘","language":"ko","contextIds":["paper-jok-2026-scale","paper-aaai-2027-reference-efficient","paper-cikm-2026-thales"]}'
          if [ "$status" != "200" ]; then
            echo "FAIL generation: expected HTTP 200, got $status" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('response.json', encoding='utf-8') as f: data=json.load(f)
          assert data.get('grounded') is True, data
          assert isinstance(data.get('answer'), str) and len(data['answer'].strip()) >= 20, data
          assert isinstance(data.get('usedSourceIds'), list) and data['usedSourceIds'], data
          assert data.get('model'), data
          print('PASS generation', {'model': data.get('model'), 'usedSourceIds': data.get('usedSourceIds'), 'answerChars': len(data['answer'])})
          PY
