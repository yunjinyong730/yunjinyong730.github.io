name: live RAG smoke test

on:
  push:
    branches:
      - test/live-rag-smoke

permissions:
  contents: read

jobs:
  live-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test production RAG endpoint
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://yunjinyong730-github-io.vercel.app/api/rag"

          test_case() {
            local name="$1"
            local payload="$2"
            echo "=== $name ==="
            status=$(curl --silent --show-error --max-time 45 \
              -o response.json -w "%{http_code}" \
              -X POST "$ENDPOINT" \
              -H "Content-Type: application/json" \
              --data "$payload")
            echo "HTTP $status"
            cat response.json
            echo
            if [ "$status" != "200" ]; then
              echo "Expected HTTP 200, got $status" >&2
              exit 1
            fi
            python3 - <<'PY'
          import json
          with open('response.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('grounded') is True, data
          assert isinstance(data.get('answer'), str) and len(data['answer'].strip()) >= 20, data
          assert isinstance(data.get('usedSourceIds'), list) and data['usedSourceIds'], data
          assert data.get('model'), data
          print('PASS', {'model': data.get('model'), 'usedSourceIds': data.get('usedSourceIds'), 'answerChars': len(data['answer'])})
          PY
          }

          test_case "Korean judgment question" '{"query":"윤진용이 쓴 논문 중에 제일 중요한 논문 알려줘","language":"ko","contextIds":["paper-jok-2026-scale","paper-aaai-2027-reference-efficient","paper-cikm-2026-thales"]}'
          test_case "Korean Edge AI question" '{"query":"경량 Edge AI를 가장 잘 보여주는 연구는 뭐야? 이유도 설명해줘","language":"ko","contextIds":["paper-cikm-2026-thales","paper-jok-2026-scale","paper-ksc-dam"]}'
          test_case "English grounded question" '{"query":"Which paper best represents Yun Jinyong’s sensor calibration research and why?","language":"en","contextIds":["paper-jok-2026-scale","paper-aaai-2027-reference-efficient","paper-cikm-2026-thales"]}'
